<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestión de Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="fake-login" style="position: fixed; inset: 0; background: rgba(245, 247, 255, 0.98); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
    <div style="background: #6366f1; padding: 20px; border-radius: 50%; margin-bottom: 20px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </div>
    <h1 style="color: #1e1e2f; margin-bottom: 10px; font-family: 'Outfit', sans-serif;">¡Bienvenido al Sistema!</h1>
    <p style="margin-bottom: 40px; font-size: 1.2rem; color: #666; font-family: 'Outfit', sans-serif;">Selecciona tu rol para ingresar</p>
    <div style="display: flex; gap: 20px;">
      <button id="btn-login-admin" style="padding: 15px 30px; font-size: 1rem; cursor: pointer; background: #6366f1; color: white; border: none; border-radius: 12px; font-weight: 600; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);">
        👨‍💻 Administrador
      </button>
      <button id="btn-login-cliente" style="padding: 15px 30px; font-size: 1rem; cursor: pointer; background: white; color: #6366f1; border: 2px solid #6366f1; border-radius: 12px; font-weight: 600;">
        👤 Cliente
      </button>
    </div>
  </div>
  <div id="app">
    <header>
      <div class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
        </div>
        <span class="logo-text">Sistema de Gestión de Pedidos</span>
      </div>
      <nav>
        <button class="nav-btn active" data-view="pedidos">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          <span>Pedidos</span>
        </button>
        <button class="nav-btn" data-view="historial">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Historial</span>
        </button>
        <button class="nav-btn" data-view="repartidores">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          <span>Repartidores</span>
        </button>
        <button class="nav-btn nav-new" data-view="nuevo-pedido">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Nuevo Pedido</span>
        </button>
      </nav>
    </header>

    <main id="main-content">
      <div class="loading-state">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box">
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
